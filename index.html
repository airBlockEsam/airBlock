<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blocs du club</title>
<style>
:root{--y:#fcec52;--bd:#e3e3e3;--mut:#6f6f6f;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#f2f2f2;color:#1b1b1b;font:16px/1.4 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--y);display:flex;align-items:center;gap:14px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
header button{background:none;border:0;font-size:26px;line-height:1;padding:4px;color:#000}
#ti{flex:1;font-size:19px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;background:#000;color:var(--y);padding:2px 7px;border-radius:9px;margin-right:6px}
#mm{position:absolute;top:56px;left:8px;z-index:6;background:#fff;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.3);padding:6px;display:flex;flex-direction:column}
#mm[hidden]{display:none}#mm button{text-align:left;padding:10px 16px}
#lf{display:none;gap:8px;flex-wrap:wrap;padding:8px 16px;background:#fff}
main{max-width:720px;margin:0 auto;padding:0 0 110px}
button,select,input{font:inherit}
button{cursor:pointer;border:0;background:#fff;border-radius:6px;padding:9px 14px;color:#111;box-shadow:0 1px 3px rgba(0,0,0,.25)}
input,select{padding:9px;border:1px solid var(--bd);border-radius:6px;background:#fff;color:#111;max-width:100%}
.mut{color:var(--mut);font-size:14px}.pd{padding:16px}
.cd{background:#fff;margin:16px 14px;padding:14px 18px;border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.pl{width:100%;display:block;touch-action:manipulation}.pl text{font-size:3px;fill:#8a8a8a;pointer-events:none}
.mp{width:92px;height:58px;flex:none}
.sr{display:flex;justify-content:space-between;align-items:center;font-size:21px;margin:8px 0}
.x{background:none;box-shadow:none;font-size:26px;padding:0 6px}
.cb{display:flex;margin:12px 0}.cb button{flex:1;height:44px;border-radius:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.cb button.on{box-shadow:inset 0 0 0 4px #fcec52,inset 0 0 0 6px #000}
.ft{display:flex;justify-content:space-between}.tx{background:none;box-shadow:none;font-weight:700;letter-spacing:.5px;padding:10px 4px}.tx.on{text-decoration:underline}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 14px}.cd .row{margin:10px 0}
.yb{background:var(--y);font-weight:700}.dg{color:#c0261a}.on{outline:2px solid #000}
.lh{padding:8px 18px;color:#8a8a8a}.lh select{border:0;background:none;color:#8a8a8a;font-size:18px;padding:0}
.it{display:flex;align-items:center;gap:10px;background:#fff;padding:8px 14px;border-bottom:1px solid var(--bd);cursor:pointer}
.sn{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:700;color:#7f35d4;width:16px}
.th{position:relative;width:62px;height:62px;border-radius:50%;border:5px solid #999;overflow:hidden;flex:none;background:#ccc}
.th img{position:absolute}.mt{flex:1;min-width:0;font-weight:500}.ck{color:#bbb;font-size:20px;font-weight:700}.ck.me{color:#2e9a3f}
.pw{position:relative}.ph{position:relative;line-height:0;touch-action:manipulation;background:#777;user-select:none}
.ph img{width:100%;display:block;-webkit-user-drag:none}.ph.no{padding:40px;text-align:center;color:#fff;line-height:1.4}
.ov{position:absolute;inset:0;width:100%;height:100%}
.ov polygon{pointer-events:all;cursor:pointer;vector-effect:non-scaling-stroke}.ov polygon.c{stroke:#fcec52;stroke-dasharray:5 3;stroke-width:2;fill:rgba(252,236,82,.25)}
.ov .dl{fill:rgba(252,236,82,.2);stroke:#fcec52;stroke-width:2;vector-effect:non-scaling-stroke}
.dm polygon,.dm .d{pointer-events:none}
.d{position:absolute;width:30px;height:30px;border-radius:50%;transform:translate(-50%,-50%);border:3px solid #fff}
.dp{position:absolute;width:10px;height:10px;border-radius:50%;background:#fcec52;border:2px solid #000;transform:translate(-50%,-50%);pointer-events:none}
.rb{position:absolute;transform:translate(-50%,-50%);background:#000;color:#fff;font:700 12px/1 system-ui;padding:3px 5px;border-radius:9px;pointer-events:none}
.fl{position:absolute;right:14px;top:34%;display:flex;flex-direction:column;gap:12px}
.fb{width:48px;height:48px;border-radius:50%;background:var(--y);font-size:20px;padding:0}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:#bdbdbd;font-size:28px;padding:0;color:#fff}
.fab.on{background:#2e9a3f}
.bt2{display:flex;gap:18px;align-items:center;padding:14px 16px;font-weight:500}
</style></head>
<body>
<header><button id="mn" aria-label="Menu">☰</button><span id="ti">Blocs du club</span><span id="dev"></span></header>
<div id="mm" hidden><button data-a="mall">Tous les blocs</button><button data-a="mine">Mes blocs</button></div>
<form id="lf"><input id="le" type="email" placeholder="Email" autocomplete="username"><input id="lp" type="password" placeholder="Mot de passe" autocomplete="current-password"><button class="yb">Connexion</button></form>
<main id="app"><p class="mut pd">Chargement…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CL={vert:'#34801f',orange:'#f08a1c',bleu:'#4287e0',rouge:'#cc2b1c',blanc:'#ffffff',noir:'#000000',violet:'#7f35d4'};
const LBL={hand:'Main',start:'Départ',foot:'Pied',finish:'Fin'},BG={start:'D',foot:'P',finish:'F'};
let db,assets,isDev=false,me={id:null,name:'Anonyme'},S=[],H=[],P=[],ready=false,TT='Blocs du club';
let v={n:'home',sid:null,pid:null,cf:[],mine:false,per:'all',tool:'hand',cr:null,em:'auto',dp:[],hs:null,cand:null,sens:45,tol:40,note:'',place:null,menu:false};
const snap=q=>q.docs.map(d=>Object.assign({id:d.id},d.data()));
const secs=()=>[...S].sort((a,b)=>(a.n||1e9)-(b.n||1e9)||String(a.id).localeCompare(String(b.id)));
const num=id=>{const s=S.find(x=>x.id===id);return s?(s.n||secs().findIndex(x=>x.id===id)+1):0};
const seg=s=>{if(s.a&&s.b)return[s.a,s.b];const i=num(s.id)-1,x=6+(i%8)*11,y=56-Math.floor(i/8)*8;return[[x,y],[x+9,y]]};
const rc=c=>c==='blanc'?'#fff':CL[c]||'#999';

function plan(sel,mini,hl){
  const L=secs().map(s=>{const[a,b]=seg(s),on=s.id===sel,c=on?'#000':hl&&!hl.has(s.id)?'#e6e6e6':'#b3b3b3',w=(mini?2.3:1)*(on?3.4:2.4),co=`x1='${a[0]}' y1='${a[1]}' x2='${b[0]}' y2='${b[1]}' stroke-linecap='round'`;
    return `<g ${mini?'':`data-a='sec'`} data-s='${s.id}'><line ${co} stroke='transparent' stroke-width='7'/><line ${co} stroke='${c}' stroke-width='${w}' ${on?'':`stroke-dasharray='6 1.2'`} pointer-events='none'/>${mini?'':`<text x='${(a[0]+b[0])/2}' y='${(a[1]+b[1])/2-2.5}' text-anchor='middle'>${num(s.id)}</text>`}</g>`}).join('');
  const pm=!mini&&v.place&&v.place.a?`<circle cx='${v.place.a[0]}' cy='${v.place.a[1]}' r='1.6' fill='#d32'/>`:'';
  return `<svg ${mini?`class='mp'`:`id='plan' class='pl'`} viewBox='0 0 100 64' role='img' aria-label='Plan de la salle'>${L}${pm}</svg>`;
}
function thumb(s,p){
  const hs=p.holds||{},k=Object.keys(hs),st=k.find(i=>hs[i]==='start')||k[0],h=H.find(x=>x.id===st);
  return `<span class='th' style='border-color:${p.color==='blanc'?'#fff':rc(p.color)};box-shadow:0 0 0 1px #999'>${s&&s.img&&h?`<img src='${esc(s.img)}' alt='' style='left:50%;top:50%;width:420%;transform:translate(-${h.x}%,-${h.y}%)'>`:''}</span>`;
}
function item(p,s){
  return `<span class='sn' style='color:${p.color==='blanc'?'#999':rc(p.color)}'>${num(p.sid)}</span>${thumb(s,p)}<div class='mt'>${esc(p.name)}</div>${plan(p.sid,true)}<span class='ck${(p.done||[]).includes(me.id)?' me':''}'>${(p.done||[]).length}✓</span>`;
}
function swatches(act,cur){return `<div class='cb'>`+Object.keys(CL).map(k=>`<button data-a='${act}' data-c='${k}' aria-label='${k}' class='${cur(k)?'on':''}' style='background:${CL[k]}'></button>`).join('')+`</div>`}

function vHome(){
  const sel=S.find(x=>x.id===v.sid);
  const hl=v.cf.length?new Set(P.filter(p=>v.cf.includes(p.color)).map(p=>p.sid)):null;
  const l=P.filter(p=>(!sel||p.sid===sel.id)&&(!v.cf.length||v.cf.includes(p.color))&&(!v.mine||p.uid===me.id)&&(v.per==='all'||p.t>Date.now()-2592e6)).sort((a,b)=>b.t-a.t);
  TT=l.length+' bloc'+(l.length>1?'s':'')+(sel?' · Secteur '+num(sel.id):'');
  let h=`<div class='cd'>${plan(sel&&sel.id,false,hl)}`;
  if(v.place)h+=`<p class='mut'>${v.place.a?'Touche la fin du secteur sur le plan.':'Touche le début du secteur sur le plan.'}</p>`;
  h+=`<div class='sr'><span>${sel?'Secteur '+num(sel.id):'Touche un secteur'}</span>${sel?`<button class='x' data-a='sec' data-s='${sel.id}' aria-label='Désélectionner'>✕</button>`:''}</div>`;
  h+=swatches('cf',k=>v.cf.includes(k))+`<div class='ft'><button class='tx' data-a='reset'>RÉINITIALISER</button><button class='tx${v.mine?' on':''}' data-a='mine'>MES BLOCS</button></div></div>`;
  if(sel)h+=`<div class='row'>${sel.img?`<button class='yb' data-a='new'>+ Nouveau bloc</button>`:`<span class='mut'>Pas encore de photo.</span>`}${isDev?`<button data-a='edit'>Photo et prises</button><button data-a='place'>Placer sur le plan</button><button class='dg' data-a='delS'>Supprimer</button>`:''}</div>`;
  h+=`<div class='lh'><select id='per' aria-label='Période'><option value='all'${v.per==='all'?' selected':''}>Tous les blocs</option><option value='month'${v.per==='month'?' selected':''}>Ce mois-ci</option></select></div>`;
  h+=l.length?l.map(p=>`<div class='it' data-a='open' data-p='${p.id}'>${item(p,S.find(x=>x.id===p.sid))}</div>`).join(''):`<p class='mut pd'>Aucun bloc ici pour l’instant.</p>`;
  if(isDev)h+=`<div class='cd'><b>Nouveau secteur</b><div class='row'><input id='sf' type='file' accept='image/*'><button class='yb' data-a='addS'>Ajouter</button></div><div class='mut' id='st'>${esc(v.note)}</div></div>`;
  return h;
}

function poly(h,st){return `<polygon data-a='hold' data-id='${h.id}' points='${h.p}' style='${st}'/>`}
function photo(s){
  if(!s||!s.img)return `<div class='ph no'>Pas de photo pour ce secteur</div>`;
  const p=v.n==='prob'?P.find(x=>x.id===v.pid):null,cr=v.n==='create'?v.cr:null,ed=v.n==='edit';
  const key=cr?cr.color:p&&p.color,sel=cr?cr.sel:p?(p.holds||{}):{},col=rc(key),u=key==='noir'?'#fff':'#000';
  let o='',b='';
  H.filter(h=>h.sid===s.id).forEach(h=>{
    const r=sel[h.id],on=ed&&v.hs===h.id;if(!r&&!cr&&!ed)return;
    if(h.p){o+=r?poly(h,`stroke:${u};stroke-width:6;opacity:.45;fill:none`)+poly(h,`stroke:${col};stroke-width:3.5;fill:none`):poly(h,on?'stroke:#fcec52;stroke-width:4;fill:rgba(252,236,82,.3)':ed?'stroke:#fcec52;stroke-width:1.5;fill:rgba(255,255,255,.1)':'stroke:#fff;stroke-width:1.5;fill:rgba(255,255,255,.08)')}
    else b+=`<i class='d' data-a='hold' data-id='${h.id}' style='left:${h.x}%;top:${h.y}%;border-color:${r?col:on?'#fcec52':'#fff'}'></i>`;
    if(r&&BG[r])b+=`<b class='rb' style='left:${h.x}%;top:${h.y}%'>${BG[r]}</b>`;
  });
  o+=(v.cand||[]).map((c,i)=>`<polygon class='c' data-a='cand' data-i='${i}' points='${c.p}'/>`).join('');
  const dr=ed&&v.em==='draw';
  if(dr&&v.dp.length){o+=`<polygon class='dl' style='pointer-events:none' points='${v.dp.map(q=>q.join(',')).join(' ')}'/>`;b+=v.dp.map(q=>`<i class='dp' style='left:${q[0]}%;top:${q[1]}%'></i>`).join('')}
  return `<div class='ph${dr?' dm':''}' data-a='img'><img src='${esc(s.img)}' alt='Photo du secteur ${num(s.id)}'><svg class='ov' viewBox='0 0 100 100' preserveAspectRatio='none'>${o}</svg>${b}</div>`;
}

function vProb(){
  const p=P.find(x=>x.id===v.pid);if(!p){v.n='home';return vHome()}
  const s=S.find(x=>x.id===p.sid)||{},dn=(p.done||[]).includes(me.id);TT=p.name;
  return `<div class='it' style='cursor:default'>${item(p,s)}</div><div class='pw'>${photo(s)}<div class='fl'><button class='fb' data-a='share' aria-label='Partager'>↗</button></div></div><div class='bt2'><span>✓ ${(p.done||[]).length}</span><span>${new Date(p.t).toLocaleDateString('fr-FR')}</span><span class='mut'>par ${esc(p.by)}</span>${isDev||p.uid===me.id?`<button class='tx dg' data-a='delP' data-p='${p.id}'>Supprimer</button>`:''}</div><button class='fab${dn?' on':''}' data-a='done' aria-label='Marquer comme réussi'>✓</button>`;
}
function vCreate(){
  const s=S.find(x=>x.id===v.sid),c=v.cr;if(!s||!c){v.n='home';return vHome()}
  TT='Nouveau bloc · Secteur '+num(s.id);
  return photo(s)+`<div class='cd'>${swatches('cc',k=>c.color===k)}<div class='row'>`+Object.keys(LBL).map(k=>`<button class='${v.tool===k?'on':''}' data-a='tool' data-t='${k}'>${LBL[k]}</button>`).join('')+`</div><p class='mut'>Choisis la couleur, puis un type de prise et touche les prises du bloc (re-touche pour retirer). ${Object.keys(c.sel).length} prise(s).</p><div class='row'><input id='bn' placeholder='Nom du bloc (facultatif)' value='${esc(c.name)}'><button class='yb' data-a='save'>Enregistrer</button><button data-a='back'>Annuler</button></div></div>`;
}
function vEdit(){
  const s=S.find(x=>x.id===v.sid);if(!s||!isDev){v.n='home';return vHome()}
  TT='Prises · Secteur '+num(s.id);const n=(v.cand||[]).length,dr=v.em==='draw';
  let h=photo(s)+`<div class='cd'>`;
  h+=`<div class='row'><button class='yb' data-a='detect'>Détecter les prises</button><label class='mut'>Sensibilité <input id='sens' type='range' min='15' max='90' value='${v.sens}'></label>${n?`<button class='yb' data-a='valid'>Valider ${n} prises</button><button data-a='clr'>Effacer</button>`:''}</div>`;
  h+=`<div class='row'><button class='${dr?'':'on'}' data-a='em' data-m='auto'>Clic : détourage auto</button><button class='${dr?'on':''}' data-a='em' data-m='draw'>Tracer à la main</button><label class='mut'>Tolérance <input id='tol' type='range' min='15' max='90' value='${v.tol}'></label></div>`;
  if(dr)h+=`<div class='row'><button class='yb' data-a='dfin'>Terminer le contour (${v.dp.length} pts)</button><button data-a='dundo'>Retirer le dernier point</button></div>`;
  if(v.hs)h+=`<div class='row'><button data-a='redraw'>Redessiner le contour de la prise</button><button class='dg' data-a='delh'>Supprimer la prise</button></div>`;
  h+=`<p class='mut'>${dr?(v.hs?'Touche autour de la prise sélectionnée, point par point.':'Touche autour de la prise, point par point.'):'Touche la photo pour détourer une prise, ou touche une prise pour la sélectionner.'}${n?' Touche un contour jaune pour l’écarter.':''} ${H.filter(x=>x.sid===s.id).length} prise(s).</p><div class='mut' id='st'>${esc(v.note)}</div><div class='row'><label class='btn'><button onclick="this.nextElementSibling.click()">Changer la photo</button><input id='rf' type='file' accept='image/*' hidden></label></div></div>`;
  return h;
}
function render(){
  const a=$('#app');
  if(!ready){a.innerHTML=`<p class='mut pd'>${esc(TT)}</p>`;return}
  if(document.activeElement&&document.activeElement.id==='bn')return;
  a.innerHTML={home:vHome,prob:vProb,create:vCreate,edit:vEdit}[v.n]();
  $('#ti').textContent=TT;$('#mn').textContent=v.n==='home'?'☰':'←';$('#mm').hidden=!v.menu;
}

async function img(f){const b=await createImageBitmap(f),k=Math.min(1,1800/b.width),c=document.createElement('canvas');c.width=b.width*k;c.height=b.height*k;c.getContext('2d').drawImage(b,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.85))}
async function up(f){const st=$('#st'),s=t=>{if(st)st.textContent=t};s('Envoi de la photo…');try{const r=await assets.upload(await img(f));s('');return r.url}catch(e){s('Échec : '+(e.message||e));return null}}

/* Détourage et détection */
const PX={};
async function pix(s){
  if(PX[s.id]&&PX[s.id].u===s.img)return PX[s.id];
  const im=new Image();im.crossOrigin='anonymous';im.src=s.img;await im.decode();
  const k=Math.min(1,700/im.naturalWidth),w=Math.round(im.naturalWidth*k),h=Math.round(im.naturalHeight*k);
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,w,h);
  return PX[s.id]={u:s.img,w,h,d:x.getImageData(0,0,w,h).data};
}
function outline(m,w,h,cx,cy){
  const N=32,R=[];
  for(let a=0;a<N;a++){const t=a*2*Math.PI/N,dx=Math.cos(t),dy=Math.sin(t);let r=0,miss=0;
    for(let s=1;s<w;s++){const x=Math.round(cx+dx*s),y=Math.round(cy+dy*s);if(x<0||y<0||x>=w||y>=h||!m[y*w+x]){if(++miss>2)break}else{miss=0;r=s}}
    R.push(r)}
  return R.map((_,a)=>{const r=Math.max(1.5,[R[(a+N-1)%N],R[a],R[(a+1)%N]].sort((u,z)=>u-z)[1]+.5),t=a*2*Math.PI/N;
    return ((cx+Math.cos(t)*r)/w*100).toFixed(1)+','+((cy+Math.sin(t)*r)/h*100).toFixed(1)}).join(' ');
}
function wand(P,sx,sy,tol){
  const w=P.w,h=P.h,d=P.d;let r=0,g=0,b=0,n=0;
  for(let y=sy-2;y<=sy+2;y++)for(let x=sx-2;x<=sx+2;x++)if(x>=0&&y>=0&&x<w&&y<h){const i=(y*w+x)*4;r+=d[i];g+=d[i+1];b+=d[i+2];n++}
  r/=n;g/=n;b/=n;
  for(let t=tol,k=0;k<4;k++,t*=.75){
    const m=new Uint8Array(w*h),st=[sy*w+sx];m[st[0]]=1;let c=0,sxm=0,sym=0,ok=true;
    while(st.length){const p=st.pop(),x=p%w,y=(p/w)|0;c++;sxm+=x;sym+=y;if(c>w*h*.05){ok=false;break}
      const nb=[];if(x>0)nb.push(p-1);if(x<w-1)nb.push(p+1);if(y>0)nb.push(p-w);if(y<h-1)nb.push(p+w);
      for(const q of nb)if(!m[q]){const i=q*4;if(Math.hypot(d[i]-r,d[i+1]-g,d[i+2]-b)<=t){m[q]=1;st.push(q)}}}
    if(ok&&c>=12)return{m,cx:sxm/c,cy:sym/c};
  }
  return null;
}
async function addHold(x,y){
  const s=S.find(z=>z.id===v.sid);let p='';
  try{const P=await pix(s),r=wand(P,Math.round(x/100*(P.w-1)),Math.round(y/100*(P.h-1)),v.tol);
    if(r){p=outline(r.m,P.w,P.h,r.cx,r.cy);x=Math.round(r.cx/P.w*1000)/10;y=Math.round(r.cy/P.h*1000)/10;v.note=''}else v.note='Contour introuvable : essaie « Tracer à la main » ou change la tolérance.'}
  catch(e){v.note='Détourage impossible ('+(e.message||e)+') : utilise « Tracer à la main ».'}
  await db.collection('holds').add(p?{sid:s.id,x,y,p}:{sid:s.id,x,y});render();
}
// détection auto : écart à la couleur locale du mur + couleurs saturées, puis érosion pour séparer les prises collées
async function detect(){
  const s=S.find(z=>z.id===v.sid);
  try{
    const P=await pix(s),w=P.w,h=P.h,d=P.d,N=w*h,W=w+1;
    const R=Math.round(Math.max(w,h)/14),I=[0,1,2].map(()=>new Float64Array(W*(h+1)));
    for(let c=0;c<3;c++){const J=I[c];for(let y=0;y<h;y++){let r=0;for(let x=0;x<w;x++){r+=d[(y*w+x)*4+c];J[(y+1)*W+x+1]=J[y*W+x+1]+r}}}
    const t=95-v.sens*.8,m=new Uint8Array(N);
    for(let y=0;y<h;y++){const y0=Math.max(0,y-R),y1=Math.min(h,y+R+1);
      for(let x=0;x<w;x++){const x0=Math.max(0,x-R),x1=Math.min(w,x+R+1),a=(y1-y0)*(x1-x0),i=(y*w+x)*4;let q=0;
        for(let c=0;c<3;c++){const J=I[c],mu=(J[y1*W+x1]-J[y0*W+x1]-J[y1*W+x0]+J[y0*W+x0])/a;q+=(d[i+c]-mu)**2}
        q=Math.sqrt(q);const mx=Math.max(d[i],d[i+1],d[i+2]),mn=Math.min(d[i],d[i+1],d[i+2]);
        if(q>t||(mx>60&&(mx-mn)/mx>.35&&q>t*.5))m[y*w+x]=1}}
    const e=new Uint8Array(N);
    for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x;if(m[i]&&m[i-1]&&m[i+1]&&m[i-w]&&m[i+w])e[i]=1}
    const vis=new Uint8Array(N),sc=new Uint8Array(N),out=[];
    for(let i=0;i<N&&out.length<300;i++){
      if(!e[i]||vis[i])continue;
      const st=[i],px=[];vis[i]=1;let x0=w,x1=0,y0=h,y1=0,sx=0,sy=0;
      while(st.length){const p=st.pop(),x=p%w,y=(p/w)|0;px.push(p);sx+=x;sy+=y;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
        for(const q of [p-1,p+1,p-w,p+w])if(e[q]&&!vis[q]){vis[q]=1;st.push(q)}}
      const a=px.length,bw=x1-x0+1,bh=y1-y0+1;
      if(a<N*.00015||a>N*.02||Math.max(bw,bh)>4*Math.min(bw,bh)||a<.3*bw*bh||x0<2||y0<2||x1>w-3||y1>h-3)continue;
      const tmp=[];px.forEach(p=>{for(const q of [p,p-1,p+1,p-w,p+w])if(m[q]&&!sc[q]){sc[q]=1;tmp.push(q)}});
      const cx=sx/a,cy=sy/a;out.push({x:Math.round(cx/w*1000)/10,y:Math.round(cy/h*1000)/10,p:outline(sc,w,h,cx,cy)});
      tmp.forEach(q=>sc[q]=0);
    }
    v.note=out.length?out.length+' prises détectées : écarte les erreurs puis valide.':'Aucune prise détectée : change la sensibilité.';
    return out;
  }catch(e){v.note='Analyse impossible : '+(e.message||e);return null}
}

/* Actions */
const A={
  menu:()=>{v.menu=!v.menu},
  mall:()=>{v.mine=false},mine:()=>{v.mine=!v.mine&&true},
  back:()=>{if(v.n==='home'){v.menu=!v.menu;return}v.n='home';v.pid=null;v.cr=null;v.cand=null;v.hs=null;v.em='auto';v.dp=[];v.note=''},
  sec:e=>{v.sid=v.sid===e.dataset.s?null:e.dataset.s},
  cf:e=>{const c=e.dataset.c;v.cf=v.cf.includes(c)?v.cf.filter(x=>x!==c):[...v.cf,c]},
  reset:()=>{v.cf=[];v.sid=null;v.mine=false},
  open:e=>{v.pid=e.dataset.p;v.n='prob'},
  new:()=>{v.cr={sel:{},name:'',color:'violet'};v.n='create'},
  cc:e=>{v.cr.color=e.dataset.c},
  tool:e=>{v.tool=e.dataset.t},
  hold:async e=>{const id=e.dataset.id;
    if(v.n==='create'){const s=v.cr.sel;if(s[id]===v.tool)delete s[id];else s[id]=v.tool}
    else if(v.n==='edit'){v.hs=v.hs===id?null:id}},
  save:async()=>{const c=v.cr;if(!Object.keys(c.sel).length){alert('Ajoute au moins une prise.');return}
    if(me.name==='Anonyme'){me.name=(prompt('Ton prénom ?')||'Anonyme').slice(0,30);try{localStorage.setItem('n',me.name)}catch(e){}}
    const r={sid:v.sid,name:c.name.trim()||'Sans nom',color:c.color,by:me.name,uid:me.id,holds:c.sel,t:Date.now(),done:[]};
    v.cr=null;v.n='home';await db.collection('problems').add(r)},
  done:async()=>{const p=P.find(x=>x.id===v.pid),d=new Set(p.done||[]);d.has(me.id)?d.delete(me.id):d.add(me.id);await db.doc('problems/'+p.id).update({done:[...d]})},
  share:async()=>{const p=P.find(x=>x.id===v.pid);try{if(navigator.share)await navigator.share({title:p.name,url:location.href});else{await navigator.clipboard.writeText(location.href);alert('Lien copié.')}}catch(e){}},
  delP:async e=>{await db.doc('problems/'+e.dataset.p).delete();v.n='home';v.pid=null},
  edit:()=>{v.n='edit';v.note=''},
  place:()=>{v.place={a:null}},
  delS:async()=>{if(!confirm('Supprimer ce secteur, ses prises et ses blocs ?'))return;const sid=v.sid;v.sid=null;
    await Promise.all([db.doc('sectors/'+sid).delete(),...H.filter(h=>h.sid===sid).map(h=>db.doc('holds/'+h.id).delete()),...P.filter(p=>p.sid===sid).map(p=>db.doc('problems/'+p.id).delete())])},
  addS:async()=>{const f=$('#sf').files[0];if(!f){v.note='Choisis une photo.';return}const u=await up(f);if(!u)return;
    const n=Math.max(0,S.length,...S.map(x=>x.n||0))+1;await db.collection('sectors').add({n,img:u});v.note='Secteur ajouté : sélectionne-le puis « Placer sur le plan ».'},
  em:e=>{v.em=e.dataset.m;v.dp=[];if(v.em==='auto')v.hs=v.hs},
  redraw:()=>{v.em='draw';v.dp=[]},
  dundo:()=>{v.dp.pop()},
  dfin:async()=>{const q=v.dp;if(q.length<3){v.note='Il faut au moins 3 points.';return}
    const p=q.map(z=>z[0].toFixed(1)+','+z[1].toFixed(1)).join(' '),x=Math.round(q.reduce((a,z)=>a+z[0],0)/q.length*10)/10,y=Math.round(q.reduce((a,z)=>a+z[1],0)/q.length*10)/10;
    if(v.hs)await db.doc('holds/'+v.hs).update({p,x,y});else await db.collection('holds').add({sid:v.sid,x,y,p});
    v.dp=[];v.em='auto';v.hs=null;v.note='Contour enregistré.'},
  delh:async()=>{const id=v.hs;v.hs=null;await db.doc('holds/'+id).delete()},
  detect:async()=>{v.note='Analyse…';render();await new Promise(r=>setTimeout(r,30));v.cand=await detect()},
  cand:e=>{v.cand.splice(+e.dataset.i,1)},
  clr:()=>{v.cand=null;v.note=''},
  valid:async()=>{const ex=H.filter(h=>h.sid===v.sid),nw=v.cand.filter(c=>!ex.some(h=>Math.hypot(h.x-c.x,h.y-c.y)<1.5));v.cand=null;v.note=nw.length+' prises ajoutées.';
    await Promise.all(nw.map(c=>db.collection('holds').add({sid:v.sid,x:c.x,y:c.y,p:c.p})))}
};
document.addEventListener('click',async e=>{
  if(!ready)return;
  if(v.place&&e.target.closest('#plan')){
    const svg=$('#plan'),pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse()),xy=[Math.round(q.x*10)/10,Math.round(q.y*10)/10];
    if(!v.place.a)v.place.a=xy;else{await db.doc('sectors/'+v.sid).update({a:v.place.a,b:xy});v.place=null}
    render();return}
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a;
  if(a==='img'){
    if(v.n==='edit'&&isDev){const r=t.getBoundingClientRect(),x=Math.round((e.clientX-r.left)/r.width*1000)/10,y=Math.round((e.clientY-r.top)/r.height*1000)/10;
      if(v.em==='draw'){v.dp.push([x,y]);render()}else{v.hs=null;await addHold(x,y)}}
    return}
  if(a==='delP')e.stopPropagation();
  if(a!=='menu'&&a!=='back')v.menu=false;
  if(A[a]){await A[a](t);render()}
});
$('#mn').addEventListener('click',()=>{if(!ready)return;A.back();render()});
$('#mm').addEventListener('click',()=>{v.menu=false;render()});
document.addEventListener('input',e=>{
  if(e.target.id==='sens')v.sens=+e.target.value;if(e.target.id==='tol')v.tol=+e.target.value;
  if(e.target.id==='bn'&&v.cr)v.cr.name=e.target.value});
document.addEventListener('change',async e=>{
  if(e.target.id==='per'){v.per=e.target.value;render()}
  if(e.target.id==='rf'&&e.target.files[0]){const u=await up(e.target.files[0]);if(u)await db.doc('sectors/'+v.sid).update({img:u})}});

/* Supabase */
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const wrap=r=>({docs:r.map(x=>({id:x.id,data:()=>x.data}))});
db={
  collection:c=>({
    add:async d=>{const{error}=await sb.from('kv').insert({coll:c,data:d});if(error){alert('Refusé : '+error.message);throw error}},
    onSnapshot:(cb,er)=>{const load=async()=>{const{data,error}=await sb.from('kv').select('id,data').eq('coll',c);error?er&&er(error):cb(wrap(data))};load();
      sb.channel('r-'+c).on('postgres_changes',{event:'*',schema:'public',table:'kv',filter:'coll=eq.'+c},load).subscribe();setInterval(load,20000)}
  }),
  doc:p=>{const id=p.split('/')[1];return{
    update:async d=>{const{data}=await sb.from('kv').select('data').eq('id',id).single();const{error}=await sb.from('kv').update({data:{...data.data,...d}}).eq('id',id);if(error)throw error},
    delete:async()=>{const{error}=await sb.from('kv').delete().eq('id',id);if(error)throw error}}}
};
assets={upload:async b=>{const n=Date.now()+'-'+Math.random().toString(36).slice(2)+'.jpg';
  const{error}=await sb.storage.from('photos').upload(n,b,{contentType:'image/jpeg'});if(error)throw error;
  return{url:sb.storage.from('photos').getPublicUrl(n).data.publicUrl}}};
function badge(){$('#dev').innerHTML=isDev?`<span class='tag'>DEV</span><button data-o='1' aria-label='Se déconnecter'>⏻</button>`:`<button data-l='1' aria-label='Compte développeur'>👤</button>`}
$('#dev').addEventListener('click',async e=>{
  if(e.target.dataset.l){const f=$('#lf');f.style.display=f.style.display==='none'?'flex':'none'}
  if(e.target.dataset.o)await sb.auth.signOut()});
$('#lf').addEventListener('submit',async e=>{e.preventDefault();
  const{error}=await sb.auth.signInWithPassword({email:$('#le').value,password:$('#lp').value});
  if(error)alert('Connexion refusée : '+error.message);else $('#lf').style.display='none'});
(async()=>{
  try{let id=localStorage.getItem('u');if(!id){id=crypto.randomUUID();localStorage.setItem('u',id)}me={id,name:localStorage.getItem('n')||'Anonyme'}}
  catch(e){me={id:'anon-'+Math.random(),name:'Anonyme'}}
  isDev=!!(await sb.auth.getSession()).data.session;badge();
  sb.auth.onAuthStateChange((_,x)=>{isDev=!!x;if(!isDev&&v.n==='edit')v.n='home';badge();render()});
  ready=true;
  const er=e=>{console.error(e)};
  db.collection('sectors').onSnapshot(q=>{S=snap(q);render()},er);
  db.collection('holds').onSnapshot(q=>{H=snap(q);render()},er);
  db.collection('problems').onSnapshot(q=>{P=snap(q);render()},er);
  render();
})();
</script></body></html>
